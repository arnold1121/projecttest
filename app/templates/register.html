{% extends "base.html" %}{% block content %}
<section class="section wrap narrow-page">
    <div class="eyebrow">JOIN THE COASTAL TABLE</div>
    <h1 class="page-title">Create your account.</h1>
    <p class="page-subtitle">Save favourites and view your demo orders in one place.</p>
    <form method="post" action="/register" class="card-panel stacked-form"><label>Full name<input name="name" required
                                                                                                  maxlength="120"
                                                                                                  autocomplete="name"></label><label>Email
        address<input type="email" name="email" required maxlength="180" autocomplete="email"></label><label>Password
        <small>(8 characters minimum)</small><input type="password" name="password" required minlength="8"
                                                    autocomplete="new-password"></label><label>Confirm password<input
            type="password" name="confirm_password" required minlength="8" autocomplete="new-password"></label>
        <button class="button button-dark button-wide" type="submit">Create account <span>→</span></button>
        <p>Already have an account? <a href="/login">Sign in</a></p></form>
</section>{% endblock %}
