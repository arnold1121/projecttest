{% extends "admin/base_admin.html" %}{% set active='products' %}{% block admin_content %}
<section class="admin-card form-card">
    <div class="admin-card-head">
        <div><h2>{{ 'Edit product' if edit_mode else 'Create product' }}</h2>
            <p>Update the listing, its sample price, and stock.</p></div>
        <a href="/admin/products">← Back</a></div>
    <form method="post"
          action="{% if edit_mode %}/admin/products/{{ product.id }}/edit{% else %}/admin/products/create{% endif %}"
          class="admin-form-grid"><label class="wide">Product name *<input name="name" required maxlength="160"
                                                                           value="{{ product.name if product else '' }}"></label><label>Price
        in rupees *<input name="price" type="number" min="0" step="0.01" required
                          value="{{ product.price if product else '' }}"></label><label>Discount price<input
            name="discount_price" type="number" min="0" step="0.01"
            value="{{ product.discount_price if product and product.discount_price is not none else '' }}"></label><label>Category<select
            name="category_id">
        <option value="">Uncategorised</option>
        {% for category in categories %}
        <option value="{{ category.id }}" {% if product and product.category_id==category.id %}selected{% endif %}>{{
            category.name }}
        </option>
        {% endfor %}</select></label><label>Weight<input name="weight" maxlength="50"
                                                         value="{{ product.weight if product else '200 g' }}"></label><label>Stock
        quantity *<input name="stock_quantity" type="number" min="0" required
                         value="{{ product.stock_quantity if product else 10 }}"></label><label>Spice level<input
            name="spice_level" value="{{ product.spice_level if product else 'Medium' }}"></label><label class="wide">Image
        URL<input type="url" name="image_url" maxlength="1200" value="{{ product.image_url if product else '' }}"
                  placeholder="A Wikimedia Commons image URL or local /static/images/... fallback"></label><label
            class="wide">Description<textarea name="description" rows="3" maxlength="3000">{{ product.description if product else '' }}</textarea></label><label
            class="wide">Ingredients<textarea name="ingredients" rows="3" maxlength="1200">{{ product.ingredients if product else '' }}</textarea></label><label
            class="check-label"><input type="checkbox" name="is_featured" {% if product and product.is_featured
                                       %}checked{% endif %}> Featured on homepage</label><label
            class="check-label"><input type="checkbox" name="is_active" {% if not product or product.is_active
                                       %}checked{% endif %}> Active product</label>
        <div class="wide form-actions">
            <button class="admin-primary" type="submit">{{ 'Save changes' if edit_mode else 'Create product' }}</button>
            <a href="/admin/products">Cancel</a></div>
    </form>
</section>{% endblock %}
